<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<style>html,body{margin:0;background:#000;color:#fff;font-family:sans-serif}</style>
</head>
<body>
<!-- Admin file: it opens the site's own code in admin mode (see admin.js), so nothing is copied or duplicated. -->
<script>
fetch("index.html", { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("index.html not found");
    return r.text();
}).then(function (html) {
    html = html.replace("<head>", function () { return "<head><script>window.__ADMIN_PAGE = true;<\/script>"; });
    html = html.replace("</body>", function () { return '<script src="admin.js"><\/script></body>'; });
    document.open();
    document.write(html);
    document.close();
}).catch(function () {
    location.replace("index.html");
});
</script>
</body>
</html>
